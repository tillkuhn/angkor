<div class="app-flex">

  <mat-card appearance="outlined" class="app-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon svgIcon="place"></mat-icon>
        Add a lovely new Place
      </mat-card-title>
    </mat-card-header>
    <form (ngSubmit)="onFormSubmit()" [formGroup]="formData">

      <mat-form-field class="app-full-width">
        <mat-label>What's your name, Place?</mat-label>
        <input [errorStateMatcher]="matcher" formControlName="name" matInput>
        <mat-error>
          @if (!formData.get('name').valid && formData.get('name').touched) {
            <span>At least 3 chars, please ...</span>
          }
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Area</mat-label>
        <mat-select formControlName="areaCode">
          @for (areaCode of countries$ | async; track areaCode) {
            <mat-option [value]="areaCode.code">
              {{areaCode.name}}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div class="app-button-row">
        <button [disabled]="!formData.valid" color="primary" mat-flat-button type="submit">
          <mat-icon>add</mat-icon>
          Add
        </button>
        &nbsp;
        <a [routerLink]="['/places']" color="primary" mat-flat-button>
          <mat-icon>list</mat-icon>
        List</a>
      </div>
    </form>
  </mat-card>

</div>
