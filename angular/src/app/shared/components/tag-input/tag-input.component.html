<div [formGroup]="parentForm">
  <mat-form-field class="app-full-width">
    <mat-label>Add Tags ...</mat-label>
    <mat-chip-grid #chipList>

      @for (tag of parentForm.get(parentFormTagsControlName).value; track tag; let i = $index) {
        <mat-chip-row
          (removed)="removeTag(i)"
          [removable]="removable"
          [selectable]="selectable"
          color="accent">
          {{tag}}
          @if (removable) {
            <mat-icon matChipRemove>cancel</mat-icon>
          }
        </mat-chip-row>
      }

      <!-- https://material.angular.io/components/chips/examples -->
      <input
        #tagInput
        matInput
        [formControl]="tagInputCtl"
        [matAutocomplete]="auto"
        [matChipInputAddOnBlur]="addOnBlur"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        (matChipInputTokenEnd)="addTag($event)"
        >

    </mat-chip-grid>

    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="tagSelected($event)">
      @for (tag of filteredTags | async; track tag) {
        <mat-option [value]="tag">
          {{tag}}
        </mat-option>
      }
    </mat-autocomplete>

  </mat-form-field>

</div>
