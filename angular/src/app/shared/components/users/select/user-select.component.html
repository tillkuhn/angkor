<mat-form-field>
  <mat-label>{{label}}</mat-label>
  <mat-select [formControl]="formControlSelect">
    @for (userSummary of authService.userSummaries(); track userSummary) {
      <mat-option [value]="userSummary.id">
        {{userSummary.emoji}} {{userSummary.shortname}}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
